[project]
name = "malka"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "mutagen>=1.48.1",
    "pillow>=13.0.0",
    "pyqt6>=6.11.0",
]

[project.scripts]
malka = "malka:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
